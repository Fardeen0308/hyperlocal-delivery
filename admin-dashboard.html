<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="f.css">
</head>
<body>

<div class="admin-layout">

    <div class="sidebar">

        <h2>🛵 HyperLocal</h2>

        <a href="admin-dashboard.html">📊 Dashboard</a>

        <a href="products.html">🛍 Products</a>

        <a href="orders-admin.html">📦 Orders</a>

        <a href="coupons.html">🎟 Coupons</a>

        <a href="delivery.html">🛵 Delivery</a>

        <a href="index.html">🏠 Website</a>

        <a href="admin.html">🚪 Logout</a>

    </div>

    <div class="main-content">

<h1>📊 Admin Analytics</h1>

<div class="dashboard">

    <div class="card">
        <h2>📦 Orders</h2>
        <h1 id="orders">0</h1>
    </div>

    <div class="card">
        <h2>💰 Revenue</h2>
        <h1 id="revenue">₹0</h1>
    </div>

    <div class="card">
        <h2>👥 Customers</h2>
        <h1 id="customers">0</h1>
    </div>

    <div class="card">
        <h2>🚚 Delivery Partners</h2>
        <h1 id="partners">0</h1>
    </div>

    <h2>🔥 Best Selling Products</h2>

<div id="bestProducts"></div>

<h2>📦 Order Status</h2>

<div class="dashboard">

<div class="card">
<h3>🟡 Pending</h3>
<h1 id="pending">0</h1>
</div>

<div class="card">
<h3>👨‍🍳 Preparing</h3>
<h1 id="preparing">0</h1>
</div>

<div class="card">
<h3>🛵 Out for Delivery</h3>
<h1 id="delivery">0</h1>
</div>

<div class="card">
<h3>✅ Delivered</h3>
<h1 id="delivered">0</h1>
</div>

</div>

</div>

<script>

async function loadAnalytics(){

    const response = await fetch(
        "https://hyperlocal-backend-84rs.onrender.com/admin-analytics"
    );

    const data = await response.json();

    document.getElementById("orders").innerHTML =
    data.totalOrders;

    document.getElementById("revenue").innerHTML =
"₹" + Number(data.totalRevenue).toFixed(2);

    document.getElementById("customers").innerHTML =
    data.totalCustomers;

    document.getElementById("partners").innerHTML =
    data.totalDeliveryPartners;

    let html = "";

data.bestSellingProducts.forEach(product => {

    html += `
        <p>
            🛍️ ${product[0]} - ${product[1]} Orders
        </p>
    `;

});

document.getElementById("bestProducts").innerHTML = html;

document.getElementById("pending").innerHTML =
data.pending;

document.getElementById("preparing").innerHTML =
data.preparing;

document.getElementById("delivery").innerHTML =
data.outForDelivery;

document.getElementById("delivered").innerHTML =
data.delivered;
}

loadAnalytics();

</script>
</div>
<script src="admin.js"></script>
</body>
</html>
