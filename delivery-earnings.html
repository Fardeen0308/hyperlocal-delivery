<!DOCTYPE html>
<html>
<head>
    <title>Delivery Earnings</title>
    <link rel="stylesheet" href="f.css">
</head>
<body>

<h1>💰 My Earnings</h1>

<div class="dashboard">

    <div class="card">
        <h3>💰 Total Earnings</h3>
        <h1 id="totalEarnings">₹0</h1>
    </div>

    <div class="card">
        <h3>📦 Total Deliveries</h3>
        <h1 id="totalDeliveries">0</h1>
    </div>

    <div class="card">
        <h3>📅 Today's Earnings</h3>
        <h1 id="todayEarnings">₹0</h1>
    </div>

    <div class="card">
        <h3>📆 This Month</h3>
        <h1 id="monthEarnings">₹0</h1>
    </div>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

async function loadEarnings(){

    const response = await fetch(
        "https://hyperlocal-backend-84rs.onrender.com/delivery-earnings/" + user.email
    );

    const data = await response.json();

    document.getElementById("totalEarnings").innerHTML =
    "₹" + data.totalEarnings;

    document.getElementById("totalDeliveries").innerHTML =
    data.totalDeliveries;

    document.getElementById("todayEarnings").innerHTML =
    "₹" + data.todayEarnings;

    document.getElementById("monthEarnings").innerHTML =
    "₹" + data.monthEarnings;

}

loadEarnings();

</script>

</body>
</html>
