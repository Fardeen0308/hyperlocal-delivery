<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="f.css">
</head>

<body>

<header class="profile-header">
    <h1>👤 My Profile</h1>
    <p>Manage your account information</p>
</header>

<div class="profile-container">

    <div class="profile-card">

        <div class="profile-avatar" id="profileAvatar">
            👤
        </div>

        <h2 id="name">Loading...</h2>

        <p class="profile-role" id="role"></p>

        <div class="profile-info">

            <div class="profile-info-row">
                <span>📧</span>
                <div>
                    <small>Email</small>
                    <p id="email">Loading...</p>
                </div>
            </div>

            <div class="profile-info-row">
                <span>📱</span>
                <div>
                    <small>Phone</small>
                    <p id="phone">Not added</p>
                </div>
            </div>

        </div>

        <button class="profile-edit-btn" onclick="editProfile()">
            ✏️ Edit Profile
        </button>

        <button class="profile-logout-btn" onclick="logout()">
            🚪 Logout
        </button>

    </div>

</div>

<div class="bottom-nav">

    <a href="index.html">
        🏠<br>
        <span>Home</span>
    </a>

    <a href="wishlist.html">
        ❤️<br>
        <span>Wishlist</span>
    </a>

    <a href="orders.html">
        📦<br>
        <span>Orders</span>
    </a>

    <a href="profile.html" class="active">
        👤<br>
        <span>Profile</span>
    </a>

</div>

<script>

const user =
    JSON.parse(localStorage.getItem("user"));

if (!user) {

    window.location.href = "login.html";

} else {

    document.getElementById("name").innerText =
        user.name || "User";

    document.getElementById("email").innerText =
        user.email || "Not available";

    document.getElementById("phone").innerText =
        user.phone || "Not added";

    document.getElementById("role").innerText =
        user.role ? user.role.toUpperCase() : "CUSTOMER";

    // Create avatar using first letter of name
    if (user.name) {

        document.getElementById("profileAvatar").innerText =
            user.name.charAt(0).toUpperCase();

    }

}

function editProfile() {

    alert("Profile editing will be added next.");

}

function logout() {

    localStorage.removeItem("user");

    window.location.href = "login.html";

}

</script>

</body>
</html>
