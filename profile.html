<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - HyperLocal</title>

    <link rel="stylesheet" href="f.css">

</head>

<body>

<!-- HEADER -->

<header class="profile-page-header">

    <h1>👤 My Profile</h1>

    <p>Manage your HyperLocal account</p>

</header>


<!-- PROFILE -->

<main class="profile-page">

    <div class="customer-profile-card">

        <!-- Avatar -->

        <div class="customer-avatar" id="avatar">
            👤
        </div>

        <h2 id="customerName">
            Customer
        </h2>

        <p class="customer-email" id="customerEmail">
            Loading...
        </p>


        <!-- ACCOUNT INFORMATION -->

        <div class="profile-details">

            <div class="profile-detail">

                <span>📧</span>

                <div>

                    <small>Email</small>

                    <p id="email">
                        -
                    </p>

                </div>

            </div>


            <div class="profile-detail">

                <span>📱</span>

                <div>

                    <small>Phone</small>

                    <p id="phone">
                        Not added
                    </p>

                </div>

            </div>


            <div class="profile-detail">

                <span>🏠</span>

                <div>

                    <small>Address</small>

                    <p id="address">
                        Not added
                    </p>

                </div>

            </div>

        </div>


        <!-- PROFILE ACTIONS -->

        <div class="profile-actions">

            <button
                onclick="window.location.href='orders.html'">

                📦 My Orders

            </button>


            <button
                onclick="window.location.href='wishlist.html'">

                ❤️ My Wishlist

            </button>


            <button
                onclick="editProfile()">

                ✏️ Edit Profile

            </button>


            <button
                class="logout-button"
                onclick="logout()">

                🚪 Logout

            </button>

        </div>

    </div>

</main>


<!-- BOTTOM NAVIGATION -->

<div class="bottom-nav">

    <a href="index.html">

        🏠
        <br>
        <span>Home</span>

    </a>


    <a href="wishlist.html">

        ❤️
        <br>
        <span>Wishlist</span>

    </a>


    <a href="orders.html">

        📦
        <br>
        <span>Orders</span>

    </a>


    <a href="profile.html"
       class="active">

        👤
        <br>
        <span>Profile</span>

    </a>

</div>


<script>

const user =
    JSON.parse(localStorage.getItem("user"));


if (!user) {

    window.location.href = "login.html";

}


else {

    const name =
        user.name || "Customer";

    const email =
        user.email || "Not available";

    const phone =
        user.phone || "Not added";

    const address =
        user.address || "Not added";


    document.getElementById("customerName")
        .innerText = name;


    document.getElementById("customerEmail")
        .innerText = email;


    document.getElementById("email")
        .innerText = email;


    document.getElementById("phone")
        .innerText = phone;


    document.getElementById("address")
        .innerText = address;


    // First letter avatar

    document.getElementById("avatar")
        .innerText =
        name.charAt(0).toUpperCase();

}


async function editProfile() {

    const user =
        JSON.parse(localStorage.getItem("user"));

    if (!user || !user.id) {

        alert("Please login again.");

        window.location.href = "login.html";

        return;
    }

    const newName = prompt(
        "Enter your name:",
        user.name || ""
    );

    if (newName === null) return;


    const newPhone = prompt(
        "Enter your phone number:",
        user.phone || ""
    );

    if (newPhone === null) return;


    const newAddress = prompt(
        "Enter your address:",
        user.address || ""
    );

    if (newAddress === null) return;


    try {

        const response = await fetch(
            "https://hyperlocal-backend-84rs.onrender.com/users/" + user.id,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: newName,

                    phone: newPhone,

                    address: newAddress

                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            alert(
                "❌ " +
                (data.message || "Update failed")
            );

            return;
        }


        // Save updated Supabase user

        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );


        // Update profile page

        document.getElementById("customerName")
            .innerText =
            data.user.name || "Customer";


        document.getElementById("customerEmail")
            .innerText =
            data.user.email || "Not available";


        document.getElementById("email")
            .innerText =
            data.user.email || "Not available";


        document.getElementById("phone")
            .innerText =
            data.user.phone || "Not added";


        document.getElementById("address")
            .innerText =
            data.user.address || "Not added";


        document.getElementById("avatar")
            .innerText =
            (data.user.name || "C")
            .charAt(0)
            .toUpperCase();


        alert("✅ Profile updated successfully!");

    }

    catch (error) {

        console.error("Profile error:", error);

        alert(
            "❌ Unable to connect to server."
        );

    }

}

function logout() {

    localStorage.removeItem("user");

    window.location.href =
        "login.html";

}

</script>

</body>

</html>
