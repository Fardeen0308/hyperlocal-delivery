<!DOCTYPE html>
<html>
<head>

</head>

</div>

<div class="stats">

</div>

</div>

</div>

</div>
</header>

<div id="orders"></div>

<a href="customer-chat.html">
<button>💬 Customer Chat</button>
</a>

<button onclick="toggleStatus()" id="statusBtn">
🟢 Available
</button>

<button onclick="window.location.href='delivery-earnings.html'">
💰 My Earnings
</button>

<h2>💰 Completed Deliveries</h2>

<div id="history"></div>

</html>
