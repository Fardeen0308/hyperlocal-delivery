<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HyperLocal</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="form-box">
        <h2>Forgot Password?</h2>
        <p>Enter your registered email address.
        We'll send you a password reset link.</p>

        <form id="forgotForm">
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit" id="submitBtn">
                Send Reset Link
            </button>
        </form>

        <p id="message"></p>

        <p>
            Remember your password?
            <a href="login.html">Login</a>
        </p>
    </div>

    <script>
        const API_URL =
            "https://hyperlocal-backend-84rs.onrender.com";

        document.getElementById("forgotForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const message =
                    document.getElementById("message");

                const button =
                    document.getElementById("submitBtn");

                button.disabled = true;
                button.textContent = "Sending...";

                try {
                    const response = await fetch(
                        API_URL + "/forgot-password",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ email })
                        }
                    );

                    const data = await response.json();

                    message.textContent =
                        data.message || "If the account exists, a reset link will be sent.";

                } catch (error) {
                    message.textContent =
                        "Unable to connect. Please try again.";
                } finally {
                    button.disabled = false;
                    button.textContent = "Send Reset Link";
                }
            });
    </script>

</body>
</html>
