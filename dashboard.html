<!DOCTYPE html>
<html>
<head>
    <title>My Store Dashboard</title>
    <link rel="stylesheet" href="css/delivery.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <a href="orders-dashboard.html">
    <button>📦 Manage Orders</button>
</a>


<a href="index.html">
    <button>🏠 Home</button>
</a>

<button onclick="logout()">🚪 Logout</button>
<header>
    <h1>My Store Dashboard</h1>
    <h2 id="storeName">Loading store...</h2>
</header>

<div class="stats">

<div class="stat-card">
<h2 id="productCount">0</h2>
<p>Products</p>
</div>

<div class="stat-card">
<h2 id="orderCount">0</h2>
<p>Orders</p>
</div>

<div class="stat-card">
<h2 id="userCount">0</h2>
<p>Users</p>
</div>

<div class="stat-card">
<h2 id="sales">₹0</h2>
<p>Total Sales</p>
</div>

<div class="stat-card">
<h2 id="earnings">₹0</h2>
<p>My Earnings</p>
</div>

</div>
<div class="form-box">
    

<input type="text"
id="productName"
placeholder="Product Name">

<input type="number"
id="productPrice"
placeholder="Product Price">

<input
type="number"
id="productStock"
placeholder="Stock Quantity">

<select id="productCategory">

<option>Vegetables</option>
<option>Fruits</option>
<option>Dairy</option>
<option>Bakery</option>
<option>Beverages</option>
<option>Snacks</option>
<option>Medicines</option>
<option>Electronics</option>
<option>Fashion</option>

</select>

<label for="productImages">Select Product Images (Maximum 5)</label>

<input
    type="file"
    id="productImages"
    accept="image/jpeg,image/png,image/webp"
    multiple
>

<div id="imagePreviews"></div>

<button type="button" onclick="uploadImages()">
    Upload Images
</button>

<button onclick="addProduct()">
Add Product
</button>

</div>

<h2>Products</h2>

<div id="products"></div>
<script src="auth.js"></script>

<script>
requireRole(["admin", "store_owner"]);
</script>

<script src="dashboard.js"></script>


</body>
</html>
