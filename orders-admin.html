<!DOCTYPE html>
<html>
<head>
    <title>Admin Orders</title>
    <link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="admin-layout">

<div class="sidebar">

<h2>🛵 HyperLocal</h2>

<a href="admin-dashboard.html">📊 Dashboard</a>
<a href="products.html">🛍 Products</a>
<a href="orders-admin.html">📦 Orders</a>
<a href="coupons.html">🎟 Coupons</a>
<a href="delivery.html">🛵 Delivery</a>
<a href="index.html">🏠 Website</a>
<a href="login.html">🚪 Logout</a>

</div>

<div class="main-content">

<div class="dashboard-header">

<div class="header-left">

<h1>📦 Order Management</h1>

<h3>

Total Orders :
<span id="orderCount">0</span>

</h3>

<p>Manage and track all customer orders.</p>

</div>

<div class="live-status">
🟢 Live Orders
</div>

</div>

<div class="orders-top">

<input
type="text"
id="searchOrder"
placeholder="🔍 Search Customer..."
onkeyup="searchOrders()">

<select id="statusFilter" onchange="filterOrders()">

    <select id="paymentFilter" onchange="filterOrders()">

<option value="All">All Payments</option>

<option value="Cash on Delivery">Cash on Delivery</option>

<option value="UPI">UPI</option>

<option value="Card">Card</option>

</select>
<option value="All">All Orders</option>
<option value="Pending">Pending</option>
<option value="Preparing">Preparing</option>
<option value="Out for Delivery">Out for Delivery</option>
<option value="Delivered">Delivered</option>
</select>

</div>

<div id="orders" class="orders-grid"></div>

</div>
</div>

<div id="orderModal" class="modal">

<div class="modal-content">

<span
class="close"
onclick="closeOrder()">
&times;
</span>

<div id="orderDetails"></div>

</div>

</div>

<script src="orders-admin.js"></script>

</body>
</html>
