<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperLocal Chat</title>
    <link rel="stylesheet" href="f.css">
</head>
<body>
    <h2>💬 Delivery Chat</h2>

    <div id="chatStatus" role="status"></div>

    <div id="messages" style="
        height:450px;
        overflow-y:auto;
        padding:15px;
        background:#f5f5f5;
        border-radius:15px;
        margin-bottom:10px;
    "></div>

    <form id="chatForm">
        <input
            id="message"
            type="text"
            maxlength="1000"
            placeholder="Type a message..."
            autocomplete="off"
            required
        >
        <button id="sendButton" type="submit">Send</button>
    </form>

    <script>
    const API = "https://hyperlocal-backend-84rs.onrender.com";
    const user = JSON.parse(localStorage.getItem("user") || "null");
    const token = localStorage.getItem("token");

    // Customer chat pages use deliveryEmail.
    // Delivery dashboard chat selection uses chatWith.
    const otherEmail = (
        user?.role === "delivery"
            ? localStorage.getItem("chatWith")
            : localStorage.getItem("deliveryEmail")
    )?.trim().toLowerCase();

    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("chatStatus");
    const inputEl = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");

    let loading = false;

    if (!user || !token) {
        window.location.replace("login.html");
    } else if (!otherEmail) {
        statusEl.textContent =
            "No chat recipient selected. Open chat from your order or delivery dashboard.";
        sendButton.disabled = true;
    }

    function showMessages(chats) {
        messagesEl.replaceChildren();

        chats.forEach(chat => {
            const row = document.createElement("div");
            row.style.textAlign =
                chat.sender.toLowerCase() === user.email.toLowerCase()
                    ? "right"
                    : "left";

            const bubble = document.createElement("span");
            bubble.textContent = chat.message;
            bubble.style.display = "inline-block";
            bubble.style.padding = "8px 12px";
            bubble.style.margin = "4px 0";
            bubble.style.borderRadius = "10px";
            bubble.style.background =
                chat.sender.toLowerCase() === user.email.toLowerCase()
                    ? "#d8f8d8"
                    : "#ffffff";

            row.appendChild(bubble);
            messagesEl.appendChild(row);
        });

        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function loadMessages() {
        if (!user || !token || !otherEmail || loading) return;

        loading = true;

        try {
            const response = await fetch(
                API + "/chat/" + encodeURIComponent(otherEmail),
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const data = await response.json();

            if (!response.ok) {
                statusEl.textContent =
                    data.message || "Unable to load chat.";
                return;
            }

            statusEl.textContent = "";
            showMessages(data);
        } catch (error) {
            statusEl.textContent = "Connection error. Please try again.";
        } finally {
            loading = false;
        }
    }

    document.getElementById("chatForm").addEventListener(
        "submit",
        async event => {
            event.preventDefault();

            const message = inputEl.value.trim();
            if (!message || !otherEmail || !token) return;

            sendButton.disabled = true;

            try {
                const response = await fetch(API + "/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        receiver: otherEmail,
                        message
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    statusEl.textContent =
                        data.message || "Message could not be sent.";
                    return;
                }

                inputEl.value = "";
                statusEl.textContent = "";
                await loadMessages();
            } catch (error) {
                statusEl.textContent =
                    "Connection error. Your message may not have been sent.";
            } finally {
                sendButton.disabled = false;
            }
        }
    );

    if (user && token && otherEmail) {
        loadMessages();
        setInterval(loadMessages, 3000);
    }
    </script>
</body>
</html>
